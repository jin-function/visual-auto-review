name: Review app and extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: app
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/sync_contract.py --check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/extension.test.mjs
      - run: python tests/chrome_handoff_integration.py
  browser:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: app
      PYTHONDONTWRITEBYTECODE: '1'
      VISUAL_QA_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_test_chrome.py --destination "${{ runner.temp }}/qa-chrome" --env-file "$GITHUB_ENV"
      - run: python tests/launcher_integration.py
      - run: node tests/extension_integration.mjs
      - run: node tests/extension_integration.mjs --stale-manifest
