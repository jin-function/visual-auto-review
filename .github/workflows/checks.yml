name: Review app and extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: app
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/sync_contract.py --check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/extension.test.mjs
      - run: python tests/chrome_handoff_integration.py
      - if: runner.os == 'macOS'
        run: python tests/native_download_integration.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: app
      PYTHONDONTWRITEBYTECODE: '1'
      VISUAL_QA_TEST_PYTHON: python
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/visualqa-test-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_test_chrome.py --destination "${{ runner.temp }}/qa-chrome" --env-file "$GITHUB_ENV"
      # https://chromium.googlesource.com/chromium/src/+/main/docs/linux/suid_sandbox_development.md
      - name: Configure the official Chrome sandbox helper
        run: sudo install -o root -g root -m 4755 "$(dirname "$VISUAL_QA_TEST_CHROME")/chrome_sandbox" "$CHROME_DEVEL_SANDBOX"
      - run: python tests/launcher_integration.py
      - run: xvfb-run -a node tests/extension_integration.mjs --headed
      - run: xvfb-run -a node tests/extension_integration.mjs --headed --stale-manifest
