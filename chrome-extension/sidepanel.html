<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            시안 검수 도구
        </title>
        <link rel="stylesheet" href="sidepanel.css">
        <script src="toolbar.js" defer></script>
        <script src="sidepanel.js" type="module"></script>
    </head>
    <body>
        <main id="tools" hidden></main>
        <main id="connection">
            <h1>
                시안 검수
            </h1>
            <p>
                실제 페이지를 가리지 않는 전용 도구입니다.
            </p>
            <label for="import">
                검수 파일 불러오기
            </label>
            <input id="import" type="file" accept=".json,application/json">
            <label for="reviews">
                불러온 검수 파일
            </label>
            <select id="reviews"></select>
            <p id="review-info" class="muted"></p>
            <button id="connect" type="button" disabled>
                현재 페이지에 연결
            </button>
            <button id="open-page" type="button" disabled>
                실제 페이지 열기
            </button>
            <button id="back" type="button" hidden>
                검수 도구로 돌아가기
            </button>
            <p id="message" role="status"></p>
            <p class="muted">
                패널을 닫거나 다시 열려면 Chrome의 확장 도구 아이콘을 누르세요.
                요소 선택과 저장에는 실제 페이지의 개발자도구가 열려 있어야 합니다.
            </p>
        </main>
    </body>
</html>
